<svg xmlns="http://www.w3.org/2000/svg" width="480" height="334" viewBox="0 0 480 334" role="img" aria-label="Home Lab">
<title>Home Lab</title>
<style>
text{font-family:'Space Grotesk','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#e5e7eb}
.tx{font-size:11.2px;fill:#e5e7eb}
.sub{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:11px;fill:#6b7280}
.val{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:12px;font-weight:700;fill:#34d399}
.section{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:1.5px;fill:#6b7280}
.chip{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:10.5px;fill:#34d399}
.flow{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:9px;font-weight:700;fill:#e5e7eb}
.arrow{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:13px;fill:#374151}
.card{opacity:0;animation:up .6s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fd .5s ease-out forwards}
@keyframes fd{to{opacity:1}}
.glow{animation:gl 3.5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<defs>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".6"/><stop offset=".45" stop-color="#1f2937"/><stop offset="1" stop-color="#818cf8" stop-opacity=".6"/></linearGradient>
<linearGradient id="i" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<radialGradient id="g"><stop offset="0" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
</defs>
<g class="card">
<rect x=".75" y=".75" width="478.5" height="332.5" rx="14" fill="#0a0f1c" stroke="url(#b)" stroke-width="1.5"/>
<circle cx="425" cy="82" r="100" fill="url(#g)"/>
<circle cx="441.0" cy="147.1" r="1.2" fill="#e5e7eb" opacity="0.43" class="tw" style="animation-delay:2.25s"/><circle cx="52.0" cy="1.2" r="0.8" fill="#e5e7eb" opacity="0.43"/><circle cx="295.8" cy="21.2" r="0.8" fill="#e5e7eb" opacity="0.18"/><circle cx="267.7" cy="80.4" r="1.0" fill="#e5e7eb" opacity="0.31"/><circle cx="221.1" cy="165.0" r="0.5" fill="#e5e7eb" opacity="0.29"/><circle cx="451.0" cy="161.8" r="0.6" fill="#e5e7eb" opacity="0.18"/><circle cx="257.0" cy="226.0" r="0.5" fill="#e5e7eb" opacity="0.54" class="tw" style="animation-delay:3.04s"/><circle cx="458.7" cy="213.3" r="0.5" fill="#e5e7eb" opacity="0.21"/><circle cx="333.5" cy="95.6" r="0.6" fill="#e5e7eb" opacity="0.39"/><circle cx="479.3" cy="28.5" r="1.0" fill="#e5e7eb" opacity="0.29"/><circle cx="304.2" cy="219.0" r="1.0" fill="#e5e7eb" opacity="0.32"/><circle cx="292.2" cy="124.1" r="0.5" fill="#e5e7eb" opacity="0.41"/><circle cx="425.8" cy="252.3" r="1.2" fill="#e5e7eb" opacity="0.27" class="tw" style="animation-delay:0.63s"/><circle cx="19.3" cy="312.5" r="0.6" fill="#e5e7eb" opacity="0.54"/><circle cx="160.3" cy="27.1" r="0.8" fill="#e5e7eb" opacity="0.42"/><circle cx="34.5" cy="301.8" r="0.5" fill="#e5e7eb" opacity="0.25"/><circle cx="479.3" cy="9.4" r="0.8" fill="#e5e7eb" opacity="0.23"/><circle cx="338.7" cy="111.5" r="0.8" fill="#e5e7eb" opacity="0.50"/>
<circle cx="22" cy="20" r="3" fill="#34d399" class="glow"/>
<text x="32" y="24" class="sub">self-hosted/home-lab</text>
<line x1="1" y1="36.5" x2="479" y2="36.5" stroke="#1f2937"/>
<rect x="22" y="50" width="42" height="42" rx="11" fill="url(#i)"/>
<text x="43" y="78" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#030712">H</text>
<text x="76" y="68" style="font-size:17px;font-weight:700">Home Lab</text>
<text x="76" y="86" class="sub">Personal project · 24/7</text>
<line x1="22" y1="104.5" x2="458" y2="104.5" stroke="#1f2937"/>
<text x="22" y="127" class="section">MY CONTRIBUTION</text>
<g class="fade" style="animation-delay:0.28s"><circle cx="27" cy="153" r="3" fill="#34d399"/><text x="39" y="157" class="tx">Operate 15+ self-hosted services on Ubuntu</text></g><g class="fade" style="animation-delay:0.37s"><circle cx="27" cy="176" r="3" fill="#34d399"/><text x="39" y="180" class="tx">Secured access with TLS, SSO/2FA and mesh VPN</text></g><g class="fade" style="animation-delay:0.46s"><circle cx="27" cy="199" r="3" fill="#34d399"/><text x="39" y="203" class="tx">Tested backups, monitoring and AI sandboxes</text></g>
<line x1="314" y1="117" x2="314" y2="204" stroke="#1f2937"/>
<text x="330" y="127" class="section">PROJECT SIGNAL</text>
