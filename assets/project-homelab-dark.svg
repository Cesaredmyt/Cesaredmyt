<line x1="22" y1="218.5" x2="458" y2="218.5" stroke="#1f2937"/>
<text x="22" y="238" class="section">SYSTEM FLOW</text>
<g class="fade" style="animation-delay:0.62s"><rect x="22" y="246" width="52" height="25" rx="12.5" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".35"/><circle cx="34" cy="258.5" r="2.5" fill="#34d399"/><text x="44" y="262" class="flow">WAN</text></g><text x="82" y="263" class="arrow">→</text><g class="fade" style="animation-delay:0.70s"><rect x="102" y="246" width="56" height="25" rx="12.5" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".35"/><circle cx="114" cy="258.5" r="2.5" fill="#34d399"/><text x="124" y="262" class="flow">CADDY</text></g><text x="166" y="263" class="arrow">→</text><g class="fade" style="animation-delay:0.78s"><rect x="186" y="246" width="52" height="25" rx="12.5" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".35"/><circle cx="198" cy="258.5" r="2.5" fill="#34d399"/><text x="208" y="262" class="flow">SSO</text></g><text x="246" y="263" class="arrow">→</text><g class="fade" style="animation-delay:0.86s"><rect x="266" y="246" width="74" height="25" rx="12.5" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".35"/><circle cx="278" cy="258.5" r="2.5" fill="#34d399"/><text x="288" y="262" class="flow">SERVICES</text></g>
<rect x="22" y="286" width="58" height="20" rx="10" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/><text x="51" y="300" class="chip" text-anchor="middle">Docker</text><rect x="86" y="286" width="51" height="20" rx="10" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/><text x="111" y="300" class="chip" text-anchor="middle">Linux</text><rect x="143" y="286" width="51" height="20" rx="10" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".35"/><text x="168" y="300" class="chip" text-anchor="middle">Caddy</text>
<text x="458" y="321" text-anchor="end" class="sub">private infrastructure · running 24/7</text>
</g>
</svg>
