<svg xmlns="http://www.w3.org/2000/svg" width="480" height="206" viewBox="0 0 480 206" role="img" aria-label="Home Lab">
<title>Home Lab</title>
<style>
text{font-family:'Space Grotesk','Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#0f172a}
.tx{font-size:12.5px;fill:#64748b}
.sub{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:11px;fill:#64748b}
.val{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:11.5px;font-weight:700}
.chip{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:10.5px;fill:#059669}
.card{opacity:0;animation:up .6s ease-out forwards}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ring{animation:rg 1.4s .35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rg{to{stroke-dashoffset:0.0}}
.glow{animation:gl 3.5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.ring{stroke-dashoffset:0.0}}
</style>
<defs>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669" stop-opacity=".6"/><stop offset=".45" stop-color="#e2e8f0"/><stop offset="1" stop-color="#4f46e5" stop-opacity=".6"/></linearGradient>
<linearGradient id="i" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
</defs>
<g class="card">
<rect x=".75" y=".75" width="478.5" height="204.5" rx="14" fill="#ffffff" stroke="url(#b)" stroke-width="1.5"/>
<circle cx="22" cy="20" r="3" fill="#059669" class="glow"/>
<text x="32" y="24" class="sub">self-hosted/home-lab</text>
<line x1="1" y1="36.5" x2="479" y2="36.5" stroke="#e2e8f0"/>
<rect x="22" y="50" width="42" height="42" rx="11" fill="url(#i)"/>
<text x="43" y="78" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#f8fafc">H</text>
<text x="76" y="68" style="font-size:17px;font-weight:700">Home Lab</text>
<text x="76" y="86" class="sub">Personal project · 24/7</text>
<text x="22" y="120" class="tx">Self-hosted Ubuntu server: reverse proxy,</text><text x="22" y="138" class="tx">SSO with 2FA, mesh VPN, tested backups and</text><text x="22" y="156" class="tx">sandboxed AI agents.</text>
<rect x="22" y="172" width="58" height="20" rx="10" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".35"/><text x="51" y="186" class="chip" text-anchor="middle">Docker</text><rect x="86" y="172" width="51" height="20" rx="10" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".35"/><text x="111" y="186" class="chip" text-anchor="middle">Linux</text><rect x="143" y="172" width="51" height="20" rx="10" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".35"/><text x="168" y="186" class="chip" text-anchor="middle">Caddy</text>
<line x1="308" y1="52" x2="308" y2="152" stroke="#e2e8f0"/>
<text x="322" y="72" class="sub">Services</text><text x="396" y="72" class="val" text-anchor="end">15+</text><text x="322" y="94" class="sub">Layers</text><text x="396" y="94" class="val" text-anchor="end">6</text><text x="322" y="116" class="sub">AI agents</text><text x="396" y="116" class="val" text-anchor="end">2</text>
<circle cx="440" cy="92" r="27" fill="none" stroke="#e2e8f0" stroke-width="5"/>
<circle cx="440" cy="92" r="27" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" transform="rotate(-90 440 92)" class="ring"/>
<text x="440" y="97" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#059669">0</text>
<text x="440" y="138" text-anchor="middle" class="sub">open ports</text>
<text x="458" y="186" text-anchor="end" class="sub">running 24/7</text>
</g>
</svg>
