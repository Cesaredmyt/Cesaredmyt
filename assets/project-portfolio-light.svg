.sub{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:11px;fill:#64748b}
.val{font-family:'JetBrains Mono','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace;font-size:12px;font-weight:700;fill:#059669}
