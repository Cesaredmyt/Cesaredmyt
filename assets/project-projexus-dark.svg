.fade{opacity:0;animation:fd .5s ease-out forwards}
@keyframes fd{to{opacity:1}}
.glow{animation:gl 3.5s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.35}50%{opacity:1}}
